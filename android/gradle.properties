org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
# The Kotlin compile daemon writes outside the workspace, which is denied here;
# in-process compilation avoids the failed daemon round-trip.
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# Update source (in-app "new version available" check).
#
#   tgws.updateRepo  = owner/repo, e.g. yourname/tg-ws-proxy-android
#   tgws.updateToken = only needed for a PRIVATE repository
#
# Empty repo means the check is disabled. The token is compiled into the APK and
# can be extracted from it, so use a fine-grained, read-only token scoped to that
# single repository. To keep the secret out of the source tree entirely, put
# these two lines in the Gradle user home instead, e.g.
#   <GRADLE_USER_HOME>/gradle.properties   (here: ../.gradle-home/gradle.properties)
# Gradle reads project properties from there as well.
# ---------------------------------------------------------------------------
tgws.updateRepo=nixikon/tg-ws-proxy-android
tgws.updateToken=
